<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twobip Linux Training Terminal</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/x-icon" href="/terminal/terminal_favicon.ico">
</head>
<body>
  <div id="terminal"></div>

  <div id="editor" class="hidden">
    <div class="nano-titlebar">GNU nano 6.0 &mdash; <span id="nano-filename">untitled</span></div>
    <textarea id="editor-textarea" spellcheck="false"></textarea>
    <div class="nano-message" id="nano-message"></div>
    <div class="nano-status-bar">
      <span>^G Help</span>
      <span>^O WriteOut</span>
      <span>^W Where Is</span>
      <span>^X Exit</span>
    </div>
  </div>

  <script src="terminal.js"></script>
</body>
</html>
